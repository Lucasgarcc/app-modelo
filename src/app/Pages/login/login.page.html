<ion-header>
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="content">
  <div class="icon">
    <ion-icon name="logo-buffer"></ion-icon>
  </div>

 

  <form>
    <ion-label>Email: </ion-label>
    <ion-input
      [(ngModel)]="email"
      name="first"
      placeholder="Digite seu email"
    ></ion-input>

    <ion-label>Senha: </ion-label>
    <ion-input
      [(ngModel)]="password"
      name="password"
      type="password"
      placeholder="Digite sua senha"
    >
      <ion-input-password-toggle slot="end"></ion-input-password-toggle>
    </ion-input>

    <div class="content-button">
      <ion-button class="custom" size="large" (click)="login()">Entrar</ion-button>
      <ion-button size="large" (click)="openRegisterModal()">Cadastrar</ion-button>
    </div>

    <ion-content class="ion-padding">
      <ion-modal [isOpen]="isModalOpen">
        <ng-template>
          <ion-header>
            <ion-toolbar>
              <ion-buttons slot="start">
                <ion-button (click)="cancel()">Cancelar</ion-button>
              </ion-buttons>
              <ion-title>Cadastro</ion-title>
              <ion-buttons slot="end">
                <ion-button (click)="confirm()" [strong]="true">Confirmar</ion-button>
              </ion-buttons>
            </ion-toolbar>
          </ion-header>
          <ion-content class="ion-padding">
            <div>
              <form action="">
                <ion-list class="form-list-modal">

                  <ion-label>ID: </ion-label>
                  <ion-input
                    [(ngModel)]="id"
                    name="id"
                    type="number"
                    placeholder=""
                  ></ion-input>

                  <ion-label>Name: </ion-label>
                  <ion-input
                    [(ngModel)]="name "
                    name="name"
                    placeholder="Digite seu nome"
                    type="text"
                  ></ion-input>
              
                    <ion-label>Email: </ion-label>
                    <ion-input
                      [(ngModel)]="email"
                      name="email"
                      type="email"
                      placeholder="Digite seu email"
                    ></ion-input>
                
                    <ion-label>Senha: </ion-label>
                    <ion-input
                      [(ngModel)]="password"
                      name="password"
                      type="password"
                      placeholder="Digite uma senha"
                    >
                      <ion-input-password-toggle slot="end"></ion-input-password-toggle>
                    </ion-input>
       
                </ion-list>
                <ion-button type="submit" (click)="registerUsers()">Comfirmar</ion-button>
              </form>
             
            </div>
          </ion-content>
        </ng-template>
      </ion-modal>
    </ion-content>
  </form>


</ion-content>
