<!-- Menu -->
<ion-menu contentId="main-content" side="start" menuId="first">
  <ion-header>
    <ion-toolbar>
      <ion-title>Menu</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class="menu-content-side">
    <ion-list>
      <ion-item>
        <ion-avatar slot="start">
          <img alt="Avatar" src="https://ionicframework.com/docs/img/demos/avatar.svg" />
        </ion-avatar>

        <ion-item *ngIf="(users$ | async)?.[1] as user">
          <h2>{{ user.name }}</h2>
        </ion-item>
        
      </ion-item>
    </ion-list>
    <ion-list class="list-item-menu">
      <ion-item>
        <a class="icon-custom" href="/tabs/tab1">
          <ion-icon slot="start" name="calendar-outline"></ion-icon>
        </a>
        <ion-label>Agendar</ion-label>
      </ion-item>
      <ion-item>
        <a class="icon-custom" href="/tabs/tab2">
          <ion-icon slot="start" name="school-outline"></ion-icon>
        </a>
        <ion-label>Eventos</ion-label>
      </ion-item>
      <ion-item>
        <a class="icon-custom">
          <ion-icon slot="start" name="reader-outline"></ion-icon>
        </a>
        <ion-label>Boletos</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<!-- Página Principal -->
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button menu="first"></ion-menu-button>
    </ion-buttons>
    <ion-item *ngIf="(users$ | async)?.[1] as user">
      <h2>{{ user.name }}</h2>
    </ion-item>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" id="main-content">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Tab 1</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Conteúdo Principal -->
  <div class="datetime">
    <ion-datetime></ion-datetime>
  </div>

        <h2>{{ user.email }}</h2>
      </ion-label>
    </ion-item>
  </ion-list> -->

 
</ion-content>
